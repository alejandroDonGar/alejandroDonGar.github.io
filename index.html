            "personal-title": "personalTitle",
            "personal-text": "personalText",
            "value1t": "value1t",
            "value1d": "value1d",
            "value2t": "value2t",
            "value2d": "value2d",
            "value3t": "value3t",
            "value3d": "value3d",
            "contact-label": "contactLabel",
            "contact-title": "contactTitle",
            "contact-text": "contactText"
        };

        Object.entries(map).forEach(([id, key]) =>
        {
            const node = document.getElementById(id);
            if (node) node.textContent = t(key);
        });

        q.placeholder = t("searchPlaceholder");
        document.querySelector('#sort option[value="updated"]').textContent = t("sortUpdated");
        document.querySelector('#sort option[value="stars"]').textContent = t("sortStars");
        document.querySelector('#sort option[value="name"]').textContent = t("sortName");
        document.getElementById("filter-showcase").textContent = "Showcase";
        document.getElementById("gyro-toggle").textContent = gyroEnabled ? t("gyroOn") : t("gyro");
        updateCopyLabels(t("copyEmail"));
        applyTheme(root.getAttribute("data-theme") || storedTheme);
        setSkillText(currentSkill);
        renderRepos(allRepos);
        renderFeatured(allRepos);

        langButtons.forEach(button =>
        {
            button.classList.toggle("active", button.dataset.lang === lang);
        });
    }

    langButtons.forEach(button =>
    {
        button.addEventListener("click", () => applyLanguage(button.dataset.lang));
    });

    skillButtons.forEach(button =>
    {
        button.addEventListener("click", () =>
        {
            skillButtons.forEach(item => item.classList.remove("active"));
            button.classList.add("active");
            setSkillText(button.dataset.skill);
        });
    });

    applyLanguage(currentLang);
    setSkillText("java");

    const revealObserver = new IntersectionObserver(entries =>
    {
        entries.forEach(entry =>
        {
            if (entry.isIntersecting) entry.target.classList.add("visible");
        });
    }, { threshold: 0.14 });
    document.querySelectorAll(".reveal").forEach(element => revealObserver.observe(element));

    const sectionObserver = new IntersectionObserver(entries =>
    {
        entries.forEach(entry =>
        {
            if (!entry.isIntersecting) return;
            const pill = document.querySelector('.section-pill[href="#' + entry.target.id + '"]');
            if (pill)
            {
                pills.forEach(item => item.classList.remove("active"));
                pill.classList.add("active");
            }
        });
    }, { threshold: 0.42 });
    document.querySelectorAll("section[id], header[id]").forEach(section => sectionObserver.observe(section));

    if (hero && ribbon)
    {
        const ribbonObserver = new IntersectionObserver(entries =>
        {
            entries.forEach(entry =>
            {
                ribbon.classList.toggle("visible", !entry.isIntersecting);
            });
        }, { threshold: 0.72 });
        ribbonObserver.observe(hero);
    }

    document.querySelectorAll(".tilt-card").forEach(card =>
    {
        card.addEventListener("mousemove", event =>
        {
            if (window.innerWidth < 900) return;
            const rect = card.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            const rotateX = ((y / rect.height) - 0.5) * -10;
            const rotateY = ((x / rect.width) - 0.5) * 10;
            card.style.transform = "translateY(-8px) rotateX(" + rotateX + "deg) rotateY(" + rotateY + "deg)";
        });
        card.addEventListener("mouseleave", () =>
        {
            card.style.transform = "";
        });
    });

    document.addEventListener("mousemove", event =>
    {
        const x = (event.clientX / window.innerWidth).toFixed(3);
        const y = (event.clientY / window.innerHeight).toFixed(3);
        root.style.setProperty("--mx", x);
        root.style.setProperty("--my", y);
    });

    document.querySelectorAll(".button").forEach(button =>
    {
        button.addEventListener("click", event =>
        {
            const ripple = document.createElement("span");
            ripple.className = "ripple";
            const rect = button.getBoundingClientRect();
            ripple.style.left = (event.clientX - rect.left) + "px";
            ripple.style.top = (event.clientY - rect.top) + "px";
            button.appendChild(ripple);
            setTimeout(() => ripple.remove(), 520);
        });
    });

    window.addEventListener("scroll", () =>
    {
        root.style.setProperty("--scrollY", String(window.scrollY));
    }, { passive: true });

    function requestGyro()
    {
        if (window.innerWidth > 900) return;
        const applyGyro = () =>
        {
            if (gyroEnabled) return;
            gyroEnabled = true;
            document.getElementById("gyro-toggle").textContent = t("gyroOn");
            window.addEventListener("deviceorientation", event =>
            {
                const gamma = Math.max(-18, Math.min(18, event.gamma || 0));
                const beta = Math.max(-18, Math.min(18, event.beta || 0));
                document.querySelectorAll(".tilt-card").forEach(card =>
                {
                    const rotateY = gamma * 0.35;
                    const rotateX = (beta - 8) * -0.18;
                    card.style.transform = "translateY(-4px) rotateX(" + rotateX.toFixed(2) + "deg) rotateY(" + rotateY.toFixed(2) + "deg)";
                });
            });
        };

        if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function")
        {
            DeviceOrientationEvent.requestPermission().then(permission =>
            {
                if (permission === "granted") applyGyro();
            }).catch(() => {});
        }
        else if ("DeviceOrientationEvent" in window)
        {
            applyGyro();
        }
    }
    document.getElementById("gyro-toggle").addEventListener("click", requestGyro);

    function formatDate(iso)
    {
        const d = new Date(iso);
        return d.toLocaleDateString(currentLang === "is" ? "is-IS" : currentLang === "de" ? "de-DE" : currentLang === "en" ? "en-GB" : "es-ES", {
            year: "numeric",
            month: "short",
            day: "2-digit"
        });
    }

    function repoMeta(repo)
    {
        return `
            <div class="repo-meta">
                <span>⭐ ${repo.stargazers_count || 0}</span>
                <span>🧩 ${repo.language || "—"}</span>
                <span>🕒 ${t("updatedMeta")}: ${formatDate(repo.updated_at)}</span>
            </div>
        `;
    }

    function repoTopics(repo, featuredCard)
    {
        const topics = (repo.topics && repo.topics.length)
            ? repo.topics.slice(0, featuredCard ? 5 : 6).map(topic => `<span class="repo-pill ${topic === FEATURED_TOPIC ? "highlight" : ""}">${topic}</span>`).join("")
            : `<span class="repo-pill">${t("noTopics")}</span>`;
        return `<div class="repo-pills">${featuredCard ? `<span class="repo-pill highlight">${t("featuredBadge")}</span>` : ""}${topics}</div>`;
    }

    async function fetchRepos()
    {
        const url = `https://api.github.com/users/${GITHUB_USERNAME}/repos?per_page=100&sort=updated`;
        const res = await fetch(url, { headers: { "Accept": "application/vnd.github+json" } });
        if (!res.ok) throw new Error("GitHub error");
        const repos = await res.json();
        return repos.filter(repo => !repo.fork).map(repo => ({
            name: repo.name,
            html_url: repo.html_url,
            description: repo.description || "—",
            language: repo.language || "—",
            stargazers_count: repo.stargazers_count || 0,
            updated_at: repo.updated_at,
            topics: repo.topics || []
        }));
    }

    function renderFeatured(reposData)
    {
        const featuredRepos = reposData.filter(repo => repo.topics.includes(FEATURED_TOPIC)).slice(0, 6);
        if (!featuredRepos.length)
        {
            featured.innerHTML = `<div class="empty-state">${t("noFeatured")}</div>`;
            return;
        }

        featured.innerHTML = featuredRepos.map((repo, index) => `
            <article class="repo-card repo-featured ${index === 0 ? "repo-featured-main" : ""} tilt-card">
                <div class="repo-topline">
                    <span class="mini-label">Showcase</span>
                    <span class="repo-link-icon">↗</span>
                </div>
                <h3>${repo.name}</h3>
                <p>${repo.description}</p>
                ${repoTopics(repo, true)}
                ${repoMeta(repo)}
                <a class="button repo-button" href="${repo.html_url}" target="_blank" rel="noreferrer"><span class="btn-icon" aria-hidden="true">↗</span>${t("viewRepo")}</a>
            </article>
        `).join("");
    }

    function applyFilters(reposData)
    {
        const query = (q.value || "").toLowerCase().trim();
        const sortValue = sort.value || "updated";

        let list = reposData.filter(repo =>
        {
            const matchesText = repo.name.toLowerCase().includes(query) || (repo.description || "").toLowerCase().includes(query);
            const matchesTopic = activeTopic === "all" ? true : repo.topics.includes(activeTopic);
            return matchesText && matchesTopic;
        });

        if (sortValue === "updated") list.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
        if (sortValue === "stars") list.sort((a, b) => (b.stargazers_count || 0) - (a.stargazers_count || 0));
        if (sortValue === "name") list.sort((a, b) => a.name.localeCompare(b.name));

        return list;
    }

    function renderRepos(reposData)
    {
        const list = applyFilters(reposData);
        const visibleList = reposExpanded ? list : list.slice(0, REPOS_PREVIEW_COUNT);

        resultsCount.textContent = `${list.length} ${t("resultsFound")}`;
        toggleRepos.style.display = list.length > REPOS_PREVIEW_COUNT ? "inline-flex" : "none";
        toggleRepos.textContent = reposExpanded ? t("showLess") : t("showMore");

        if (!list.length)
        {
            repos.innerHTML = `<div class="empty-state">${t("noRepos")} "<b>${q.value || ""}</b>"</div>`;
            return;
        }

        repos.innerHTML = visibleList.map(repo => `
            <article class="repo-card tilt-card">
                <div class="repo-topline">
                    <span class="mini-label">${repo.topics.includes(FEATURED_TOPIC) ? t("featuredBadge") : t("repoBadge")}</span>
                </div>
                <h3>${repo.name}</h3>
                <p>${repo.description}</p>
                ${repoTopics(repo, false)}
                ${repoMeta(repo)}
                <a class="button repo-button subtle" href="${repo.html_url}" target="_blank" rel="noreferrer"><span class="btn-icon" aria-hidden="true">↗</span>${t("openRepo")}</a>
            </article>
        `).join("");
    }

    filterButtons.forEach(button =>
    {
        button.addEventListener("click", () =>
        {
            activeTopic = button.dataset.topic || "all";
            reposExpanded = false;
            filterButtons.forEach(item => item.classList.remove("active"));
            button.classList.add("active");
            renderRepos(allRepos);
        });
    });

    q.addEventListener("input", () => { reposExpanded = false; renderRepos(allRepos); });
    sort.addEventListener("change", () => renderRepos(allRepos));
    toggleRepos.addEventListener("click", () => { reposExpanded = !reposExpanded; renderRepos(allRepos); });

    async function initRepos()
    {
        featured.innerHTML = `<div class="skeleton"></div><div class="skeleton"></div>`;
        repos.innerHTML = `<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>`;
        try
        {
            allRepos = await fetchRepos();
            renderFeatured(allRepos);
            renderRepos(allRepos);
        }
        catch (error)
        {
            const message = `<div class="empty-state">${t("loadingError")}</div>`;
            featured.innerHTML = message;
            repos.innerHTML = message;
        }
    }

    initRepos();
});
</script>
</body>
</html>
