            {
                const gamma = Math.max(-18, Math.min(18, event.gamma || 0));
                const beta = Math.max(-18, Math.min(18, event.beta || 0));

                document.querySelectorAll(".tilt-card").forEach(card =>
                {
                    const rotateY = gamma * 0.35;
                    const rotateX = (beta - 8) * -0.18;
                    card.style.transform = "translateY(-4px) rotateX(" + rotateX.toFixed(2) + "deg) rotateY(" + rotateY.toFixed(2) + "deg)";
                });
            });
        };

        if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function")
        {
            DeviceOrientationEvent.requestPermission().then(permission =>
            {
                if (permission === "granted")
                {
                    applyGyro();
                }
            }).catch(() => {});
        }
        else if ("DeviceOrientationEvent" in window)

    async function fetchRepos()
    {
        const cacheKey = "kinetic-github-cache";
        const cacheTimeKey = "kinetic-github-cache-time";
        const maxAge = 1000 * 60 * 20;
        const cached = localStorage.getItem(cacheKey);
        const cachedTime = Number(localStorage.getItem(cacheTimeKey) || 0);

        if (cached && (Date.now() - cachedTime) < maxAge)
        {
            return JSON.parse(cached);
        }

        const url = `https://api.github.com/users/${GITHUB_USERNAME}/repos?per_page=100&sort=updated`;
        const res = await fetch(url, { headers: { "Accept": "application/vnd.github+json" } });

        if (!res.ok)
        {
            throw new Error("GitHub error");
        }

        const data = await res.json();

        const parsed = data.filter(repo => !repo.fork).map(repo => ({
            name: repo.name,
            html_url: repo.html_url,
            description: repo.description || "—",
            language: repo.language || "—",
            stargazers_count: repo.stargazers_count || 0,
            updated_at: repo.updated_at,
            topics: repo.topics || []
        }));

        localStorage.setItem(cacheKey, JSON.stringify(parsed));
        localStorage.setItem(cacheTimeKey, String(Date.now()));

        return parsed;
    }

    function clamp(value, min, max)
    {
        return Math.max(min, Math.min(max, value));
    }

    function computeSkillMetrics(reposData)
    {
        if (!reposData.length)
        {
            return {
                java: 76,
                db: 68,
                frontend: 72,
                xml: 58
            };
        }

        const langCount = {};
        const topics = [];

        reposData.forEach(repo =>
        {
            const language = (repo.language || "").toLowerCase();
            if (language)
            {
                langCount[language] = (langCount[language] || 0) + 1;
            }
            (repo.topics || []).forEach(topic =>
            {
                topics.push(String(topic).toLowerCase());
            });
        });

        const countLang = name => langCount[name.toLowerCase()] || 0;
        const countTopic = list => topics.filter(topic => list.includes(topic)).length;

        const java = clamp(48 + (countLang("java") * 14) + (countTopic(["java", "backend", "poo", "oop"]) * 5), 42, 92);
        const db = clamp(42 + (countLang("sql") * 14) + (countLang("plpgsql") * 12) + (countTopic(["sql", "database", "bbdd", "postgres", "db"]) * 5), 38, 90);
        const frontend = clamp(44 + (countLang("html") * 8) + (countLang("css") * 8) + (countLang("javascript") * 10) + (countTopic(["web", "frontend", "css", "html", "responsive"]) * 5), 40, 92);
        const xml = clamp(34 + (countLang("xml") * 14) + (countTopic(["xml", "xsd"]) * 8), 32, 86);

        return {
            java,
            db,
            frontend,
            xml
        };
    }

    function skillPoint(cx, cy, angle, radius, value)
    {
        const r = radius * (value / 100);
        const x = cx + Math.cos(angle) * r;
        const y = cy + Math.sin(angle) * r;
        return [x, y];
    }

    function updateRadarSummary(metrics)
    {
        const summary = document.getElementById("radar-summary-text");
        if (!summary)
        {
            return;
        }

        const ordered = Object.entries(metrics).sort((a, b) => b[1] - a[1]);
        const first = ordered[0]?.[0] || "java";
        const second = ordered[1]?.[0] || "db";

        const labels = {
            java: "Java",
            db: currentLang === "en" ? "Databases" : currentLang === "de" ? "Datenbanken" : currentLang === "is" ? "Gagnagrunnar" : "BBDD",
            frontend: "Frontend",
            xml: "XML"
        };

        const summaries = {
            es: "Perfil orientado a " + (first === "frontend" ? "frontend" : "backend") + " con más peso en " + labels[first] + " y apoyo en " + labels[second] + ".",
            en: (first === "frontend" ? "Frontend" : "Backend") + "-leaning profile with strongest weight in " + labels[first] + " and support from " + labels[second] + ".",
            de: (first === "frontend" ? "Frontend" : "Backend") + "-orientiertes Profil mit Schwerpunkt auf " + labels[first] + " und Unterstützung durch " + labels[second] + ".",
            is: "Prófíll sem hallar að " + (first === "frontend" ? "frontend" : "backend") + " með mesta áherslu á " + labels[first] + " og stuðning frá " + labels[second] + "."
        };

        summary.textContent = summaries[currentLang] || t("radarSummaryDefault");
    }

    function bindRepoRadarHover()
    {
        document.querySelectorAll(".repo-card").forEach(card =>
        {
            card.addEventListener("mouseenter", () =>
            {
                const text = card.textContent.toLowerCase();
                const metrics = {
                    java: text.includes("java") || text.includes("backend") ? 84 : 56,
                    db: text.includes("sql") || text.includes("bbdd") || text.includes("database") ? 80 : 48,
                    frontend: text.includes("web") || text.includes("frontend") || text.includes("html") || text.includes("css") ? 82 : 46,
                    xml: text.includes("xml") || text.includes("xsd") ? 74 : 34
                };
                updateSkillVisuals([], metrics);
                updateRadarSummary(metrics);
            });

            card.addEventListener("mouseleave", () =>
            {
                updateSkillVisuals(allRepos);
            });
        });
    }

    function updateSkillVisuals(reposData, forcedMetrics = null)
    {
        const metrics = forcedMetrics || computeSkillMetrics(reposData);
        const bars = {
            java: document.querySelector('.chart-row[data-skill="java"] .chart-bar i') || document.querySelectorAll('.chart-row .chart-bar i')[0],
            db: document.querySelector('.chart-row[data-skill="db"] .chart-bar i') || document.querySelectorAll('.chart-row .chart-bar i')[1],
            frontend: document.querySelector('.chart-row[data-skill="frontend"] .chart-bar i') || document.querySelectorAll('.chart-row .chart-bar i')[2],
            xml: document.querySelector('.chart-row[data-skill="xml"] .chart-bar i') || document.querySelectorAll('.chart-row .chart-bar i')[3]
        };

        Object.entries(metrics).forEach(([key, value]) =>
        {
            if (bars[key])
            {
                bars[key].style.setProperty('--value', value + '%');
            }
            const legendValue = document.querySelector('[data-skill-value="' + key + '"]');
            if (legendValue)
            {
                legendValue.textContent = value + '%';
            }
        });

        const cx = 120;
        const cy = 120;
        const radius = 92;
        const points = {
            java: skillPoint(cx, cy, -Math.PI / 2, radius, metrics.java),
            frontend: skillPoint(cx, cy, 0, radius, metrics.frontend),
            db: skillPoint(cx, cy, Math.PI / 2, radius, metrics.db),
            xml: skillPoint(cx, cy, Math.PI, radius, metrics.xml)
        };

        updateRadarSummary(metrics);

        const polygon = document.getElementById('radar-shape');
        if (polygon)
        {
            polygon.setAttribute('points', [
                points.java.join(','),
                points.frontend.join(','),
                points.db.join(','),
                points.xml.join(',')
            ].join(' '));
        }

        const dots = {
            java: document.getElementById('radar-dot-java'),
            frontend: document.getElementById('radar-dot-frontend'),
            db: document.getElementById('radar-dot-db'),
            xml: document.getElementById('radar-dot-xml')
        };

        Object.entries(points).forEach(([key, value]) =>
        {
            if (dots[key])
            {
                dots[key].setAttribute('cx', value[0].toFixed(1));
                dots[key].setAttribute('cy', value[1].toFixed(1));
            }
        });
    }

    function updateGitHubStats(reposData)
    {
        const publicCount = reposData.length;
        const showcaseCount = reposData.filter(repo => (repo.topics || []).includes(FEATURED_TOPIC)).length;
        const languageCount = {};
        reposData.forEach(repo =>
        {
            if (repo.language)
            {
                languageCount[repo.language] = (languageCount[repo.language] || 0) + 1;
            }
        });
        const topLang = Object.entries(languageCount)
            .filter(([name]) => name && name !== "—")
            .sort((a, b) => b[1] - a[1])[0]?.[0] || "—";
        const latest = reposData.slice().sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))[0];

        document.getElementById("stat-repos-value").textContent = String(publicCount);
        document.getElementById("stat-showcase-value").textContent = String(showcaseCount);
        document.getElementById("stat-toplang-value").textContent = String(topLang || "—");
        document.getElementById("stat-updated-value").textContent = latest ? formatDate(latest.updated_at) : "—";
    }

    function renderFeatured(reposData)
    {
        const featuredRepos = reposData.filter(repo => repo.topics.includes(FEATURED_TOPIC)).slice(0, 6);

        if (!featuredRepos.length)
        {
            featured.innerHTML = `<div class="empty-state">${t("noFeatured")}</div>`;
            return;
        }

        featured.innerHTML = featuredRepos.map((repo, index) => `
            <article class="repo-card repo-featured ${index === 0 ? "repo-featured-main" : ""} tilt-card"
                data-repo-name="${repo.name}"
                data-repo-description="${repo.description || ""}"
                data-repo-url="${repo.html_url}"
                data-repo-language="${repo.language || "—"}"
                data-repo-updated="${repo.updated_at || ""}"
                data-repo-pushed="${repo.pushed_at || ""}"
                data-repo-stars="${repo.stargazers_count || 0}"
                data-repo-topics="${(repo.topics || []).join("|")}"
                data-repo-languages-url="${repo.languages_url || ""}"
                data-repo-commits-url="${(repo.commits_url || "").replace("{/sha}", "?per_page=6")}"
                data-repo-contents-url="${repo.contents_url || ""}">
                <div class="repo-topline">
                    <span class="mini-label">Showcase</span>
                    <span>↗</span>
                </div>
                <h3>${repo.name}</h3>
                <p>${repo.description || ""}</p>
                ${repoTopics(repo, true)}
                <div class="repo-card-actions">
                    <button type="button" class="button subtle">Explorar</button>
                </div>
            </article>
        `).join("");
        bindRepoRadarHover();
    }

    function applyFilters(reposData)
    {
        const query = (q.value || "").toLowerCase().trim();
        const sortValue = sort.value || "updated";

        let list = reposData.filter(repo =>
        {
            const matchesText = repo.name.toLowerCase().includes(query) || (repo.description || "").toLowerCase().includes(query);
            const matchesTopic = activeTopic === "all" ? true : repo.topics.includes(activeTopic);
            return matchesText && matchesTopic;
        });

        if (sortValue === "updated")
        {
            list.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
        }

        if (sortValue === "stars")
        {
            list.sort((a, b) => (b.stargazers_count || 0) - (a.stargazers_count || 0));
        }

        if (sortValue === "name")
        {
            list.sort((a, b) => a.name.localeCompare(b.name));
        }

        return list;
    }

    function renderRepos(reposData)
    {
        const list = applyFilters(reposData);
        const visibleList = reposExpanded ? list : list.slice(0, REPOS_PREVIEW_COUNT);

        resultsCount.textContent = `${list.length} ${t("resultsFound")}`;
        toggleRepos.style.display = list.length > REPOS_PREVIEW_COUNT ? "inline-flex" : "none";
        toggleRepos.textContent = reposExpanded ? t("showLess") : t("showMore");

        if (!list.length)
        {
            repos.innerHTML = `<div class="empty-state">${t("noRepos")} "<b>${q.value || ""}</b>"</div>`;
            return;
        }

        repos.innerHTML = visibleList.map(repo => `
            <article class="repo-card tilt-card"
                data-repo-name="${repo.name}"
                data-repo-description="${repo.description || ""}"
                data-repo-url="${repo.html_url}"
                data-repo-language="${repo.language || "—"}"
                data-repo-updated="${repo.updated_at || ""}"
                data-repo-pushed="${repo.pushed_at || ""}"
                data-repo-stars="${repo.stargazers_count || 0}"
                data-repo-topics="${(repo.topics || []).join("|")}"
                data-repo-languages-url="${repo.languages_url || ""}"
                data-repo-commits-url="${(repo.commits_url || "").replace("{/sha}", "?per_page=6")}"
                data-repo-contents-url="${repo.contents_url || ""}">
                <div class="repo-topline">
                    <span class="mini-label">${repo.topics.includes(FEATURED_TOPIC) ? t("featuredBadge") : t("repoBadge")}</span>
                </div>
                <h3>${repo.name}</h3>
                <p>${repo.description || ""}</p>
                ${repoTopics(repo, false)}
                <div class="repo-card-actions">
                    <button type="button" class="button subtle">Explorar</button>
                </div>
            </article>
        `).join("");
    }

    filterButtons.forEach(button =>
    {
        button.addEventListener("click", () =>
        {
            activeTopic = button.dataset.topic || "all";
            reposExpanded = false;
            filterButtons.forEach(item => item.classList.remove("active"));
            button.classList.add("active");
            renderRepos(allRepos);
        });
    });

    q.addEventListener("input", () =>
    {
        reposExpanded = false;
        renderRepos(allRepos);
    });

    sort.addEventListener("change", () =>
    {
        renderRepos(allRepos);
    });

    toggleRepos.addEventListener("click", () =>
    {
        reposExpanded = !reposExpanded;
        renderRepos(allRepos);
    });

    async function initRepos()
    {
        featured.innerHTML = `<div class="skeleton"></div><div class="skeleton"></div>`;
        repos.innerHTML = `<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>`;

        try
        {
            allRepos = await fetchRepos();
            updateGitHubStats(allRepos);
            updateSkillVisuals(allRepos);
            renderFeatured(allRepos);
            renderRepos(allRepos);
        }
        catch (error)
        {
            renderRepoFallback();
            const message = `<div class="empty-state">${t("loadingError")}</div>`;
            featured.insertAdjacentHTML("beforeend", message);
        }
    }

    initRepos();
});
</script>

<script>
document.addEventListener("DOMContentLoaded", () =>
{
    const overlay = document.createElement("div");
    overlay.className = "repo-overlay";

    const spotlight = document.createElement("div");
    spotlight.className = "repo-spotlight";
    spotlight.innerHTML = `
        <div class="repo-spotlight-shell">
            <div class="repo-spotlight-card" id="repoSpotlightCard"></div>
            <div class="repo-spotlight-panel">
                <button type="button" class="button repo-spotlight-close" id="repoSpotlightClose" aria-label="Cerrar">×</button>
                <div class="repo-spotlight-head" id="repoSpotlightHead"></div>
                <div class="repo-detail-grid" id="repoSpotlightStats"></div>
                <div class="repo-tree-wrap" id="repoSpotlightTreeWrap"></div>
                <div class="repo-radar-wrap" id="repoSpotlightRadarWrap"></div>
                <div class="repo-spotlight-actions" id="repoSpotlightActions"></div>
            </div>
        </div>
    `;
    document.body.appendChild(overlay);
    document.body.appendChild(spotlight);

    const cardNode = document.getElementById("repoSpotlightCard");
    const headNode = document.getElementById("repoSpotlightHead");
    const statsNode = document.getElementById("repoSpotlightStats");
    const treeNode = document.getElementById("repoSpotlightTreeWrap");
    const radarNode = document.getElementById("repoSpotlightRadarWrap");
    const actionsNode = document.getElementById("repoSpotlightActions");
    const closeButton = document.getElementById("repoSpotlightClose");

    function parseDate(value)
    {
        if (!value)
        {
            return "";
        }

        const date = new Date(value);
        if (Number.isNaN(date.getTime()))
        {
            return "";
        }

        return new Intl.DateTimeFormat(document.documentElement.lang || "es", {
            day: "numeric",
            month: "short",
            year: "numeric"
        }).format(date);
    }

    function buildRadar(languages)
    {
        const entries = Object.entries(languages || {}).sort((a, b) => b[1] - a[1]).slice(0, 5);

        if (!entries.length)
        {
            return "";
        }

        const total = entries.reduce((sum, item) => sum + item[1], 0) || 1;
        const center = 100;
        const radius = 68;
        const levels = [1, 0.75, 0.5, 0.25];

        const grid = levels.map(level =>
        {
            const pts = entries.map((_, index) =>
            {
                const angle = (Math.PI * 2 * index / entries.length) - Math.PI / 2;
                const r = radius * level;
                const x = center + Math.cos(angle) * r;
                const y = center + Math.sin(angle) * r;
                return `${x.toFixed(1)},${y.toFixed(1)}`;
            }).join(" ");
            return `<polygon points="${pts}" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1" />`;
        }).join("");

        const axes = entries.map((_, index) =>
        {
            const angle = (Math.PI * 2 * index / entries.length) - Math.PI / 2;
            const x = center + Math.cos(angle) * radius;
            const y = center + Math.sin(angle) * radius;
            return `<line x1="${center}" y1="${center}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,0.08)" stroke-width="1" />`;
        }).join("");

        const dataPts = entries.map((entry, index) =>
        {
            const angle = (Math.PI * 2 * index / entries.length) - Math.PI / 2;
            const r = radius * (entry[1] / total);
            const x = center + Math.cos(angle) * r;
            const y = center + Math.sin(angle) * r;
            return `${x.toFixed(1)},${y.toFixed(1)}`;
        }).join(" ");

        const labels = entries.map((entry, index) =>
        {
            const angle = (Math.PI * 2 * index / entries.length) - Math.PI / 2;
            const r = radius + 18;
            const x = center + Math.cos(angle) * r;
            const y = center + Math.sin(angle) * r;
            return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" fill="currentColor" opacity="0.72" font-size="10" text-anchor="middle">${entry[0]}</text>`;
        }).join("");

        const legend = entries.map(entry =>
        {
            const pct = Math.round((entry[1] / total) * 100);
            return `<div class="repo-radar-item"><strong>${entry[0]}</strong><span>${pct}%</span></div>`;
        }).join("");

        return `
            <p class="repo-radar-title">Radar de lenguajes</p>
            <div class="repo-radar-box">
                <svg viewBox="0 0 200 200" width="200" height="200" aria-hidden="true">
                    ${grid}
                    ${axes}
                    <polygon points="${dataPts}" fill="rgba(183,198,228,0.22)" stroke="rgba(208,171,150,0.92)" stroke-width="2" />
                    ${labels}
                </svg>
                <div class="repo-radar-legend">${legend}</div>
            </div>
        `;
    }

    function buildSpotlightCard(card)
    {
        const name = card.dataset.repoName || "";
        const description = card.dataset.repoDescription || "Sin descripción.";
        const label = card.querySelector(".mini-label") ? card.querySelector(".mini-label").textContent : "Repo";
        const topics = (card.dataset.repoTopics || "").split("|").filter(Boolean).slice(0, 4);

        return `
            <div class="repo-spotlight-card-shell">
                <div class="repo-topline">
                    <span class="mini-label">${label}</span>
                    <span>↗</span>
                </div>
                <h3 class="repo-spotlight-card-title">${name}</h3>
                <p class="repo-spotlight-card-description">${description}</p>
                ${topics.length ? `<div class="repo-spotlight-card-topics">${topics.map(topic => `<span class="repo-pill">${topic}</span>`).join("")}</div>` : ""}
            </div>
        `;
    }

    function buildTree(items)
    {
        if (!Array.isArray(items) || !items.length)
        {
            return "";
        }

        const ordered = [...items]
            .sort((a, b) =>
            {
                if (a.type === b.type)
                {
                    return a.name.localeCompare(b.name);
                }
                return a.type === "dir" ? -1 : 1;
            })
            .slice(0, 10);

        return `
            <p class="repo-tree-title">Estructura del repositorio</p>
            <div class="repo-tree-list">
                ${ordered.map(item => `
                    <div class="repo-tree-item">
                        <span class="repo-tree-kind">${item.type === "dir" ? "DIR" : "FILE"}</span>
                        <span class="repo-tree-name">${item.name}</span>
                    </div>
                `).join("")}
            </div>
        `;
    }

    function animateProxy(card)
    {
        const sourceRect = card.getBoundingClientRect();
        const proxy = card.cloneNode(true);

        proxy.classList.remove("tilt-card");
        proxy.classList.add("repo-spotlight-proxy");
        proxy.querySelectorAll(".repo-card-actions, .repo-meta").forEach(node => node.remove());

        proxy.style.top = sourceRect.top + "px";
        proxy.style.left = sourceRect.left + "px";
        proxy.style.width = sourceRect.width + "px";
        proxy.style.height = sourceRect.height + "px";
        proxy.style.opacity = "1";

        document.body.appendChild(proxy);

        const targetRect = cardNode.getBoundingClientRect();

        requestAnimationFrame(() =>
        {
            proxy.style.top = targetRect.top + "px";
            proxy.style.left = targetRect.left + "px";
            proxy.style.width = targetRect.width + "px";
            proxy.style.height = targetRect.height + "px";
            proxy.style.transform = "translateZ(0)";
        });

        setTimeout(() =>
        {
            proxy.remove();
        }, 320);
    }

    async function fillSpotlight(card)
    {
        cardNode.innerHTML = buildSpotlightCard(card);
        headNode.innerHTML = "";
        statsNode.innerHTML = "";
        treeNode.innerHTML = "";
        radarNode.innerHTML = "";
        actionsNode.innerHTML = "";
        treeNode.hidden = true;
        radarNode.hidden = true;

        const name = card.dataset.repoName || "";
        const description = card.dataset.repoDescription || "Sin descripción.";
        const language = card.dataset.repoLanguage || "";
        const updated = parseDate(card.dataset.repoUpdated || "");
        const pushed = parseDate(card.dataset.repoPushed || "");
        const stars = card.dataset.repoStars || "0";
        const url = card.dataset.repoUrl || "#";
        const languagesUrl = card.dataset.repoLanguagesUrl || "";
        const commitsUrl = card.dataset.repoCommitsUrl || "";
        const contentsUrl = (card.dataset.repoContentsUrl || "").replace("{+path}", "");

        headNode.innerHTML = `<h3>${name}</h3><p>${description}</p>`;

        const statBlocks = [];
        if (language)
        {
            statBlocks.push(`<div class="repo-detail-card"><span class="repo-detail-label">Lenguaje principal</span><span class="repo-detail-value">${language}</span></div>`);
        }
        statBlocks.push(`<div class="repo-detail-card"><span class="repo-detail-label">Estrellas</span><span class="repo-detail-value">${stars}</span></div>`);
        if (updated)
        {
            statBlocks.push(`<div class="repo-detail-card"><span class="repo-detail-label">Actualizado</span><span class="repo-detail-value">${updated}</span></div>`);
        }
        if (pushed)
        {
            statBlocks.push(`<div class="repo-detail-card"><span class="repo-detail-label">Último push</span><span class="repo-detail-value">${pushed}</span></div>`);
        }
        statsNode.innerHTML = statBlocks.join("");

        actionsNode.innerHTML = `<a class="button" href="${url}" target="_blank" rel="noreferrer">Ver en GitHub</a>`;

        const requests = [
            languagesUrl ? fetch(languagesUrl).then(r => r.ok ? r.json() : {}).catch(() => ({})) : Promise.resolve({}),
            commitsUrl ? fetch(commitsUrl).then(r => r.ok ? r.json() : []).catch(() => ([])) : Promise.resolve([]),
            contentsUrl ? fetch(contentsUrl).then(r => r.ok ? r.json() : []).catch(() => ([])) : Promise.resolve([])
        ];

        const [languages, commits, contents] = await Promise.all(requests);

        const radarHtml = buildRadar(languages);
        radarNode.innerHTML = radarHtml || "";

        const treeHtml = buildTree(contents);
        treeNode.innerHTML = treeHtml || "";
        treeNode.hidden = !treeHtml;

        const extras = [];
        const commitCount = Array.isArray(commits) ? commits.length : 0;
        const languageCount = Object.keys(languages || {}).length || 0;

        if (commitCount)
        {
            extras.push(`<div class="repo-detail-card"><span class="repo-detail-label">Commits recientes</span><span class="repo-detail-value">${commitCount}</span></div>`);
        }
        if (languageCount)
        {
            extras.push(`<div class="repo-detail-card"><span class="repo-detail-label">Lenguajes detectados</span><span class="repo-detail-value">${languageCount}</span></div>`);
        }
        if (extras.length)
        {
            statsNode.innerHTML += extras.join("");
        }


    }

    document.addEventListener("mousemove", event =>
    {
        const card = event.target.closest(".repo-card, .repo-featured-main, .repo-featured-side");
        if (!card)
        {
            return;
        }

        const rect = card.getBoundingClientRect();
        const x = ((event.clientX - rect.left) / rect.width) * 100;
        const y = ((event.clientY - rect.top) / rect.height) * 100;
        card.style.setProperty("--repo-x", x + "%");
        card.style.setProperty("--repo-y", y + "%");
    }, { passive: true });

    document.addEventListener("click", event =>
    {
        const githubLink = event.target.closest(".repo-github-link");
        if (githubLink)
        {
            return;
        }

        const trigger = event.target.closest(".repo-card .button, .repo-featured-main .button, .repo-featured-side .button, .repo-card, .repo-featured-main, .repo-featured-side");
        const card = trigger ? trigger.closest(".repo-card, .repo-featured-main, .repo-featured-side") : null;

        if (!card)
        {
            return;
        }

        event.preventDefault();
        overlay.classList.add("active");
        spotlight.classList.add("active");
        fillSpotlight(card);
        requestAnimationFrame(() => animateProxy(card));
    });

    function closeSpotlight()
    {
        overlay.classList.remove("active");
        setTimeout(() =>
        {
            spotlight.classList.remove("active");
        }, 160);
    }

    overlay.addEventListener("click", closeSpotlight);
    closeButton.addEventListener("click", closeSpotlight);
    document.addEventListener("keydown", event =>
    {
        if (event.key === "Escape")
        {
            closeSpotlight();
        }
    });
});
</script>




</body>

</html>
